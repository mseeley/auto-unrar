# Runs the test suite inside the image on every branch push and pull request,
# and before every release (release.yml calls this workflow). Every platform
# the image is published for is run, not only compiled: amd64 and arm64 on
# native runners, and 32-bit arm/v7 under QEMU, since GitHub has no 32-bit
# ARM runners.

name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            runner: ubuntu-latest
            emulated: true
    runs-on: ${{ matrix.runner }}
    # A run takes minutes. The cap stops a hang (most likely under emulation)
    # from holding a runner for GitHub's default of six hours.
    timeout-minutes: 30
    env:
      TEST_PLATFORM: ${{ matrix.platform }}
      # Emulated unrar runs can sit silent well past the default 3 seconds.
      SCAN_SETTLE: ${{ matrix.emulated && 15 || 3 }}
    steps:
      - uses: actions/checkout@v7

      - if: matrix.emulated
        uses: docker/setup-qemu-action@v4

      - name: Extraction tests
        run: ./tests/run-in-docker.sh

      # A Linux host does not remap bind-mount ownership the way Docker on
      # macOS does, so this checks the real behaviour.
      - name: Ownership tests
        run: ./tests/run-ownership-in-docker.sh
